# Configuración de Nginx OPT-IN para cuando el sitio tenga dominio público e ID real de AdSense.
#
# Sirve para reemplazar nginx.conf en el despliegue final. NO usar en local:
# relaja la CSP (unes 'unsafe-inline' y dominios de Google) para que los anuncios
# puedan cargar. Eso reduce la protección frente a XSS; es el coste de AdSense.
#
# Antes de aplicarlo:
#   python3 scripts/configure-ads.py --domain TU_DOMINIO --email TU_EMAIL --pub-id ca-pub-XXXXXXXXXXXXXXXX --enable
#   cp nginx.ads.conf /etc/nginx/conf.d/default.conf   # dentro del contenedor, o cámbialo en el Dockerfile
#
# HTTPS: termina TLS con certbot en el host o añade un bloque server listen 443
# con ssl_certificate / ssl_certificate_key antes de enviar a revisión.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagmanager.com https://www.google.com https://www.gstatic.com https://www.googleadservices.com; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com; connect-src 'self' https://www.google.com https://pagead2.googlesyndication.com https://www.googleadservices.com https://www.gstatic.com https://googleads.g.doubleclick.net; frame-src https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://www.google.com https://www.gstatic.com https://www.googleadservices.com; worker-src 'self' blob:; media-src 'self' blob: https:" always;

    # ads.txt debe servirse como texto plano desde la raíz del dominio.
    location = /ads.txt {
        default_type text/plain;
        expires 1h;
    }

    location = /robots.txt {
        default_type text/plain;
        expires 1h;
    }

    location = /sitemap.xml {
        default_type application/xml;
        expires 1h;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        expires -1;
    }

    location ~* \.html$ {
        expires -1;
    }

    # Revalidar en cada carga: los nombres de archivo no tienen hash, así que
    # una caché larga sirve JS antiguo tras un despliegue y rompe los juegos.
    location ~* \.(?:css|js|svg)$ {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
