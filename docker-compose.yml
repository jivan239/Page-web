services:
  playkora:
    build:
      context: .
      dockerfile: Dockerfile
    image: playkora:latest
    container_name: playkora
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
