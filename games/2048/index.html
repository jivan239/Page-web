<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060f" />
    <meta
      name="description"
      content="2048 en Playkora: fusiona fichas en un tablero 4x4 y alcanza el 2048. Clásico jugable en el navegador."
    />
    <title>2048 · Playkora</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="../../css/consent.css" />
    <link rel="stylesheet" href="../../css/rewards.css" />
    <link rel="stylesheet" href="../../css/playfield.css" />
    <script src="../../js/ads-config.js"></script>
    <script src="../../js/consent.js"></script>
  </head>
  <body>
    <div class="pk-playfield pk-playfield--2048">
      <div class="pk-ad-host" id="pkAdHost"></div>

      <div class="pk-main">
        <main class="shell">
          <nav class="appnav" aria-label="Navegación entre juegos">
            <a class="appnav__back" href="../../">&larr; Playkora</a>
            <span class="appnav__label">08 &middot; 2048</span>
          </nav>

          <section class="machine" aria-label="Máquina de 2048">
            <header class="machine__top">
              <div class="brand">
                <h1>2048</h1>
                <p class="tagline">Fusiona · suma · llega al 2048</p>
              </div>
            </header>

            <section class="hud" aria-label="Marcadores">
              <div class="stat">
                <span class="label">Puntos</span>
                <span class="value" id="score" aria-live="polite">0</span>
              </div>
              <div class="stat">
                <span class="label">Récord</span>
                <span class="value" id="best" aria-live="polite">0</span>
              </div>
              <div class="stat">
                <span class="label">Jugadas</span>
                <span class="value" id="moves">0</span>
              </div>
            </section>

            <div class="stage">
              <canvas
                id="game"
                width="520"
                height="520"
                role="img"
                aria-label="Tablero de 2048 de cuatro por cuatro"
              ></canvas>
              <div class="overlay" id="overlay" role="dialog" aria-live="polite"></div>
            </div>

            <p class="status" id="status" role="status" aria-live="polite"></p>
            <p class="hint">
              Flechas / WASD · <kbd>Z</kbd> deshacer · <kbd>N</kbd> nueva partida ·
              <kbd>P</kbd> pausa · <kbd>M</kbd> sonido
            </p>
          </section>
        </main>
      </div>

      <aside class="pk-rail pk-rail--controls" aria-label="Controles de 2048">
        <div class="actions">
          <button class="icon-btn" type="button" id="undoBtn" aria-label="Deshacer jugada" title="Deshacer (Z)" disabled>&#8630;</button>
          <button class="icon-btn" type="button" id="newBtn" aria-label="Nueva partida" title="Nueva partida (N)">&#8635;</button>
          <button class="icon-btn" type="button" id="soundBtn" aria-label="Silenciar sonido" title="Sonido (M)">&#128266;</button>
          <button class="icon-btn" type="button" id="pauseBtn" aria-label="Pausar el juego" title="Pausa (P)" disabled>&#10074;&#10074;</button>
        </div>
        <div class="pad" aria-label="Controles táctiles">
          <button type="button" data-act="up" aria-label="Mover arriba">&uarr;</button>
          <button type="button" data-act="left" aria-label="Mover a la izquierda">&larr;</button>
          <button type="button" data-act="down" aria-label="Mover abajo">&darr;</button>
          <button type="button" data-act="right" aria-label="Mover a la derecha">&rarr;</button>
        </div>
      </aside>
    </div>

    <nav class="legal-links" aria-label="Información legal">
      <a href="../../privacidad.html">Privacidad</a>
      <a href="../../cookies.html">Cookies</a>
      <a href="../../aviso-legal.html">Aviso legal</a>
      <a href="../../sobre-nosotros.html">Sobre nosotros</a>
      <a href="../../novedades.html">Novedades</a>
      <a href="../../contacto.html">Contacto</a>
      <button type="button" data-consent-open>Configurar cookies</button>
    </nav>

    <script src="../../js/rewards-ui.js"></script>
    <script type="module" src="js/main.js"></script>
    <script src="../../js/ads.js"></script>
  </body>
</html>
