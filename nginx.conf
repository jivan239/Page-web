server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # 'wasm-unsafe-eval' permite compilar WebAssembly; NO habilita eval() de JavaScript.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        expires -1;
    }

    location ~* \.html$ {
        expires -1;
    }

    # Revalidar en cada carga: los nombres de archivo no tienen hash, así que
    # una caché larga sirve JS antiguo tras un despliegue y rompe los juegos.
    location ~* \.(?:css|js|svg)$ {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
